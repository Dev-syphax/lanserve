version: 2

project_name: lanserve

before:
  hooks:
    - go mod tidy

builds:
  - id: lanserve
    main: .
    binary: lanserve

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: Dev-syphax
    name: lanserve
